
<form class="event-form" [formGroup]="myForm">
    <div class="form-group">
        <label for="title">Titre :</label>
        <input id="title" formControlName="title"  class="form-control">
       
        </div>
    
    <div class="form-group">
        <label for="description">Description :</label>
        <input id="description" formControlName="description" class="form-control">
        
           </div>

    <div class="form-group">
        <label for="place">Lieu :</label>
        <input id="place" formControlName="lieu" class="form-control">
    </div>

    <div class="form-group">
        <label for="date">Date :</label>
        <input id="date" formControlName="date" type="date"  class="form-control">
    </div>

    <div class="form-group">
        <label for="nbMax">Nombre maximal de participants :</label>
        <input id="nbMax" type="number" formControlName="nbmax"  class="form-control">
    </div>
</form>
